name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dedich32
    steps:
      - uses: actions/checkout@v7
        with:
          path: dedich32

      # ch32-hal is a sibling path dependency (../ch32-hal), so it must
      # be checked out next to the firmware for the build to resolve.
      # Pinned to the dedich32-usbhs branch: the firmware builds against
      # its USBHS API, which differs from ch32-hal main.
      - uses: actions/checkout@v7
        with:
          repository: ArthurHeymans/ch32-hal
          ref: dedich32-usbhs
          path: ch32-hal

      - name: Format
        run: cargo fmt -p dedich32 -- --check

      - name: Clippy firmware
        run: cargo clippy -p dedich32 -- -D warnings

      - name: Build release
        run: cargo build -p dedich32 --release

      - name: Upload firmware to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dedich32/target/riscv32imfc-unknown-none-elf/release/dedich32
