[package]
name = "dedich32"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ch32-hal = { path = "../ch32-hal", features = [
    "ch32v307vct6",
    "memory-x",
    "embassy",
    "rt",
    "highcode",
    "time-driver-tim1",
] }
embassy-executor = { version = "0.9.1", features = [
    "arch-spin",
    "executor-thread",
] }
embassy-usb = "0.5.1"
embassy-sync = "0.7"
embassy-time = "0.5"
embassy-futures = "0.1"

qingke = "0.7"
qingke-rt = "0.7"

defmt = "1.1.1"
defmt-rtt = { version = "1.3.0", features = ["disable-blocking-mode"] }
panic-halt = "1.0"
static_cell = "2"
embedded-hal = "1.0"
critical-section = "1.2.0"
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
strip = false
debug = 2
lto = true
opt-level = "s"
